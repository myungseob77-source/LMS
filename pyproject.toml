[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lms-engine"
version = "0.1.0"
description = "Harness, bounded loop and LangGraph development starter"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2"]

[project.scripts]
lms-engine = "lms_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["lms_engine*"]
